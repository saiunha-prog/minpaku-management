<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#2F7FC4"/>
<title>北极星财务与民泊管理 V0.5</title>
<style>
:root{--blue:#2F7FC4;--blue2:#eaf4fb;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f8fb;--card:#fff;--danger:#c93c3c;--ok:#287a55;--air:#FF5A5F;--book:#002FA7;--tujia:#E8760A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK JP",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1280px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}.brand h1{font-size:17px;margin:0}.brand small{color:var(--muted)}.nav{display:flex;gap:7px;margin-top:13px;overflow:auto;padding-bottom:2px}.nav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;white-space:nowrap}.nav button.active{background:var(--blue);border-color:var(--blue);color:#fff}.main{padding:18px}.page{display:none}.page.active{display:block}.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.heroTop{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.hero h2{margin:0 0 5px;font-size:18px}.hero p{margin:0;color:var(--muted)}.period{display:flex;gap:5px;background:var(--bg);padding:4px;border-radius:10px}.period button{border:0;background:transparent;padding:7px 11px;border-radius:7px}.period button.active{background:#fff;box-shadow:0 1px 5px #00000014;color:var(--blue);font-weight:600}.big{font-size:32px;font-weight:750;margin:16px 0 5px}.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.label{color:var(--muted);font-size:12px}.value{font-size:22px;font-weight:700;margin-top:6px}.sub{font-size:12px;color:var(--muted);margin-top:5px}.section{margin-top:18px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.sectionTitle h3{font-size:15px;margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--danger)}.btn.small{padding:6px 9px;font-size:12px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.table{border-collapse:collapse;width:100%;min-width:780px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfd}.table tr:last-child td{border-bottom:0}.money{text-align:right!important;font-variant-numeric:tabular-nums}.platform{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:650}.air{background:#fff0f0;color:#c83b40}.book{background:#eef2ff;color:#193ca4}.tujia{background:#fff4e8;color:#a95600}.direct,.other{background:#f1f3f5;color:#555}.status{display:inline-flex;align-items:center;gap:4px;font-size:11px;border-radius:999px;padding:4px 7px;background:#eef5fa;color:#4b6475}.status.ok{background:#eaf7f0;color:var(--ok)}.form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field label{display:block;color:#4b5563;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d9dee5;border-radius:8px;padding:9px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2f7fc41a}.span2{grid-column:span 2}.span4{grid-column:1/-1}.moneyInput{text-align:right}.hint{color:var(--muted);font-size:11px;margin-top:4px}.calc{background:var(--blue2);border-radius:12px;padding:13px;margin-top:12px}.calcRow{display:flex;justify-content:space-between;gap:10px;margin:5px 0}.calcRow.total{font-weight:700;font-size:16px;border-top:1px solid #c9ddec;padding-top:9px;margin-top:9px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid #d9dee5;border-radius:8px;padding:8px;background:#fff}.empty{padding:30px;text-align:center;color:var(--muted)}.note{padding:10px 12px;background:#fff8e7;border:1px solid #f1dfae;border-radius:10px;color:#6b5420;font-size:12px}.hidden{display:none!important}.check{display:flex;gap:8px;align-items:center}.fileList{margin-top:8px;font-size:12px;color:var(--muted)}.fileItem{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#f0f3f6;font-size:11px;color:#555}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 15px;border-radius:9px;z-index:50;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.modal{position:fixed;inset:0;background:#0006;z-index:40;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}.sheetHead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:#fff;padding:0 0 12px}.sheet h3{margin:0}.close{border:0;background:#f0f2f4;border-radius:50%;width:34px;height:34px}.footer{padding:30px 18px;color:var(--muted);font-size:11px;text-align:center}@media(max-width:800px){.main{padding:12px}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.span2{grid-column:span 2}.heroTop{flex-direction:column}.period{width:100%}.period button{flex:1}}@media(max-width:480px){.fields{grid-template-columns:1fr}.span2,.span4{grid-column:auto}.g4{grid-template-columns:1fr 1fr}.big{font-size:27px}.brand h1{font-size:15px}}
</style></head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">北</div><div><h1>北极星财务与民宿管理</h1><small>V0.4 · 两人小公司经营财务系统</small></div></div><nav class="nav" id="nav"></nav></header>
<main class="main">
<section id="dashboard" class="page active"></section>
<section id="orders" class="page"></section>
<section id="lodgers" class="page"></section>
<section id="expenses" class="page"></section>
<section id="properties" class="page"></section>
<section id="reports" class="page"></section>
<section id="settings" class="page"></section>
<section id="bank" class="page"></section>
</main><div class="footer">数据默认保存在本机浏览器。V0.4 为可运行原型，重要资料请定期导出 JSON 备份。</div></div>
<div id="modal" class="modal"><div class="sheet"><div class="sheetHead"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='hokkyokusei_v04';
const OLD_KEY='hokkyokusei_v03';
const defaultData={settings:{company:'株式会社北極星',fiscalStart:9,defaultTax:10,platformRates:{Airbnb:[15.5,3],Booking:12,BookingPay:2.3,途家:12}},properties:[{id:'p1',name:'Sunshine House 向島',cleaning:10000,minNight:15000,maxNight:25000},{id:'p2',name:'Sunny Skytree House 押上',cleaning:14000,minNight:30000,maxNight:50000}],orders:[],expenses:[],lodgers:[],files:[],bank:[]};
let db=load();let view='dashboard';let periodMode='current';
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(!x){try{x=JSON.parse(localStorage.getItem(OLD_KEY));}catch(e){} }x=x||structuredClone(defaultData);x.settings??={};x.settings.platformRates??={Airbnb:[15.5,3],Booking:12,BookingPay:2.3,途家:12};x.bank??=[];return x}catch(e){return structuredClone(defaultData)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){console.error('localStorage save failed',e);toast('保存失败：浏览器本地存储空间不足');return false}}
function id(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function yen(n){return '¥'+Math.round(Number(n)||0).toLocaleString('ja-JP')}
function num(v){return Number(String(v??'').replace(/,/g,''))||0}
function fmtDate(v){if(!v)return '';return v.replaceAll('-','/')}
function nights(o){if(!o.checkin||!o.checkout)return 0;return Math.max(0,Math.round((new Date(o.checkout)-new Date(o.checkin))/86400000))}
function taxEx(gross){let t=Number(db.settings.defaultTax)||10;return {net:Math.round(gross/(1+t/100)),tax:gross-Math.round(gross/(1+t/100))}}
function platformFee(o){let base=num(o.room)-num(o.discount)+num(o.cleaning);let r=db.settings?.platformRates||{};if(o.platform==='Airbnb')return Math.round(base*(num(o.rate)||15.5)/100);if(o.platform==='Booking'){let c=Math.round(base*(num(o.rate)||12)/100);let pay=o.bookingPayFee===false?0:Math.round(base*(num(r.BookingPay)||2.3)/100);return c+pay}if(o.platform==='途家')return o.cnyMode?num(o.feeJpy):Math.round(base*(num(o.rate)||12)/100);if(o.platform==='直接预订'||o.platform==='其他'){if(o.channelFeeMode==='fixed')return num(o.channelFeeValue);if(o.channelFeeMode==='percent')return Math.round(base*num(o.channelFeeValue)/100);return 0}return 0}
function theoreticalReceipt(o){return num(o.room)-num(o.discount)+num(o.cleaning)+num(o.otherIncome)-platformFee(o)}
function receipt(o){return num(o.actualReceipt)>0?num(o.actualReceipt):theoreticalReceipt(o)}
function fiscalYear(d){let x=new Date(d||new Date()), y=x.getFullYear(),m=x.getMonth()+1;return m>=9?`${y}/${y+1}`:`${y-1}/${y}`}
function inMode(date){if(!date)return true;let now=new Date(),y=now.getFullYear();if(periodMode==='current')return fiscalYear(date)===fiscalYear(now);if(periodMode==='year')return new Date(date).getFullYear()===y;if(periodMode==='month')return new Date(date).getFullYear()===now.getFullYear()&&new Date(date).getMonth()===now.getMonth();return true}
function nav(){let items=[['dashboard','总览'],['orders','订单'],['lodgers','宿泊者名簿'],['expenses','支出'],['properties','房源'],['bank','银行'],['reports','统计与报表'],['settings','设置']];document.getElementById('nav').innerHTML=items.map(([k,v])=>`<button class="${view===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}
function go(k){view=k;nav();render()}
function render(){renderDashboard();renderOrders();renderLodgers();renderExpenses();renderProperties();renderBank();renderReports();renderSettings();document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(view).classList.add('active')}
function statOrders(){return db.orders.filter(o=>inMode(o.checkin))}
function renderDashboard(){let os=statOrders(),es=db.expenses.filter(e=>inMode(e.date));let gross=os.reduce((s,o)=>s+num(o.room)-num(o.discount)+num(o.cleaning)+num(o.otherIncome),0);let fees=os.reduce((s,o)=>s+platformFee(o),0),received=os.reduce((s,o)=>s+receipt(o),0),clean=os.reduce((s,o)=>s+num(o.cleaning),0);let other=db.expenses.length?es.reduce((s,e)=>s+num(e.amount),0):0;let net=received-other-clean;let ns=os.reduce((s,o)=>s+nights(o),0);document.getElementById('dashboard').innerHTML=`<div class="hero"><div class="heroTop"><div><h2>总览</h2><p>本期 / 本月 / 历年数据联动</p></div><div class="period">${['current','month','year'].map(m=>`<button class="${periodMode===m?'active':''}" onclick="setPeriod('${m}')">${m==='current'?'本期':m==='month'?'本月':'历年'}</button>`).join('')}</div></div><div class="big">${yen(net)}</div><div class="label">净收益</div></div><div class="grid g4"><div class="card"><div class="label">订单收入</div><div class="value">${yen(gross)}</div><div class="sub">平台扣款 ${yen(fees)}</div></div><div class="card"><div class="label">实际到账</div><div class="value">${yen(received)}</div><div class="sub">已纳入统计订单 ${os.length} 笔</div></div><div class="card"><div class="label">支出</div><div class="value">${yen(other)}</div><div class="sub">另计清扫支出 ${yen(clean)}</div></div><div class="card"><div class="label">入住</div><div class="value">${ns} 晚</div><div class="sub">宿泊者 ${os.reduce((s,o)=>s+num(o.guests),0)} 人次</div></div></div><div class="section"><div class="sectionTitle"><h3>房源汇总</h3><div class="actions"><button class="btn small" onclick="exportCSV('orders')">导出订单 CSV</button><button class="btn small" onclick="exportCSV('expenses')">导出支出 CSV</button></div></div><div class="grid g2">${db.properties.map(p=>{let po=os.filter(o=>o.propertyId===p.id),r=po.reduce((s,o)=>s+receipt(o),0);return `<div class="card"><div class="label">${p.name}</div><div class="value">${yen(r)}</div><div class="sub">${po.length} 笔 · ${po.reduce((s,o)=>s+nights(o),0)} 晚</div></div>`}).join('')}</div></div><div class="section"><div class="sectionTitle"><h3>最近订单</h3><button class="btn small primary" onclick="openOrder()">＋ 新增订单</button></div>${orderTable(os.slice().sort((a,b)=>String(b.checkin).localeCompare(String(a.checkin))).slice(0,8))}</div>`}
function setPeriod(m){periodMode=m;renderDashboard()}
function platformBadge(p){let c=p==='Airbnb'?'air':p==='Booking'?'book':p==='途家'?'tujia':p==='直接预订'?'direct':'other';return `<span class="platform ${c}">${p}</span>`}
function orderTable(arr){if(!arr.length)return `<div class="empty">暂无订单</div>`;return `<div class="tableWrap"><table class="table"><thead><tr><th>入住</th><th>客人</th><th>平台</th><th>房源</th><th>金额</th><th>实收</th><th>到账</th><th></th></tr></thead><tbody>${arr.map(o=>`<tr><td>${fmtDate(o.checkin)}<br><span class="pill">${nights(o)}晚</span></td><td>${esc(o.guest)}</td><td>${platformBadge(o.platform)}</td><td>${esc(propName(o.propertyId))}</td><td class="money">${yen(num(o.room)-num(o.discount)+num(o.cleaning)+num(o.otherIncome))}</td><td class="money"><b>${yen(receipt(o))}</b><br><span class="sub">扣款 ${yen(platformFee(o))}</span></td><td>${o.reconcileStatus==='matched'?'<span class="status ok">已对账</span>':o.reconcileStatus==='exception'?'<span class="status">异常</span>':'<span class="status">待对账</span>'}</td><td><button class="btn small" onclick="openOrder('${o.id}')">查看</button></td></tr>`).join('')}</tbody></table></div>`}
function propName(pid){return db.properties.find(p=>p.id===pid)?.name||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderOrders(){let q=document.getElementById('orderSearch')?.value||'';let arr=db.orders.filter(o=>[o.guest,o.orderNo,o.platform,propName(o.propertyId)].join(' ').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>String(b.checkin).localeCompare(String(a.checkin)));document.getElementById('orders').innerHTML=`<div class="sectionTitle"><div><h2 style="margin:0">订单</h2><div class="sub">收入、平台扣款、到账、宿泊者全部从订单进入</div></div><button class="btn primary" onclick="openOrder()">＋ 新增订单</button></div><div class="toolbar"><input id="orderSearch" value="${esc(q)}" placeholder="搜索订单号 / 客人 / 平台 / 房源" oninput="renderOrders()"><select onchange="filterOrders(this.value)"><option value="">全部平台</option><option>Airbnb</option><option>Booking</option><option>途家</option><option>直接预订</option><option>其他</option></select><button class="btn" onclick="exportCSV('orders')">导出 CSV</button><button class="btn" onclick="backup()">完整备份 JSON</button></div>${orderTable(arr)}`}
function filterOrders(p){let q=document.getElementById('orderSearch')?.value||'';let arr=db.orders.filter(o=>(!p||o.platform===p)&&[o.guest,o.orderNo,o.platform,propName(o.propertyId)].join(' ').toLowerCase().includes(q.toLowerCase())).sort((a,b)=>String(b.checkin).localeCompare(String(a.checkin)));document.querySelector('#orders .tableWrap')?.remove();document.querySelector('#orders .toolbar')?.insertAdjacentHTML('afterend',orderTable(arr))}
function openOrder(orderId){
let o=db.orders.find(x=>x.id===orderId)||{id:id('o'),platform:'Airbnb',rate:15.5,cleaning:db.properties[0]?.cleaning||0,guests:1,discounts:[],bookingPayFee:true,actualReceipt:0};
let isEdit=!!orderId;document.getElementById('modalTitle').textContent=isEdit?'编辑订单':'新增订单';
document.getElementById('modalBody').innerHTML=`<form id="orderForm" class="form"><div class="fields">
<div class="field"><label>订单号 *</label><input name="orderNo" required value="${esc(o.orderNo)}"></div>
<div class="field"><label>平台 *</label><select name="platform" id="oplat" onchange="platformChanged()"><option>Airbnb</option><option>Booking</option><option>途家</option><option>直接预订</option><option>其他</option></select></div>
<div class="field"><label>房源 *</label><select name="propertyId">${db.properties.map(p=>`<option value="${p.id}" ${p.id===o.propertyId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
<div class="field"><label>客人 *</label><input name="guest" required value="${esc(o.guest)}"></div>
<div class="field"><label>入住日 *</label><input type="date" name="checkin" required value="${o.checkin||''}"></div>
<div class="field"><label>退房日 *</label><input type="date" name="checkout" required value="${o.checkout||''}"></div>
<div class="field"><label>客人数</label><input type="number" min="1" name="guests" value="${num(o.guests)||1}"></div>
<div class="field"><label>到账日（银行实际到账日）</label><input type="date" name="paidDate" value="${o.paidDate||''}"></div>
<div class="field"><label>房费</label><input class="moneyInput" type="number" name="room" value="${num(o.room)}"></div>
<div class="field"><label>优惠总额</label><input class="moneyInput" type="number" name="discount" value="${num(o.discount)}"></div>
<div class="field"><label>清扫费（向客人收取）</label><input class="moneyInput" type="number" name="cleaning" value="${num(o.cleaning)}"></div>
<div class="field"><label>订单级其他收入</label><input class="moneyInput" type="number" name="otherIncome" value="${num(o.otherIncome)}"></div>
<div class="field"><label>渠道费用率</label><select name="rate" id="platformRate"></select><div class="hint" id="rateHint">由平台自动联动；直接预订/其他按下方规则设置</div></div>
<div class="field channelOnly hidden"><label>渠道费用类型</label><select name="channelFeeType"><option value="none">无</option><option value="intermediary">居间费</option><option value="referral">推荐费</option><option value="other">其他</option></select></div>
<div class="field channelOnly hidden"><label>渠道费用方式</label><select name="channelFeeMode"><option value="percent">按比例</option><option value="fixed">固定金额</option></select></div>
<div class="field channelOnly hidden"><label>渠道费用数值</label><input class="moneyInput" type="number" step="0.01" name="channelFeeValue" value="${num(o.channelFeeValue)||''}" placeholder="比例填 %，固定方式填日元"></div>
<div class="field bookingOnly"><label>Booking 支付方式</label><select name="bookingPayFee"><option value="true" ${(o.bookingPayFee??true)?'selected':''}>在线支付（另计 2.3%）</option><option value="false" ${o.bookingPayFee===false?'selected':''}>到店现付（支付服务费 0%）</option></select></div>
<div class="field tujiaOnly hidden"><label>途家模式</label><select name="cnyMode"><option value="false">普通日元录入</option><option value="true">人民币原单＋日元实收锚定</option></select></div>
<div class="field tujiaOnly hidden"><label>人民币房费</label><input type="number" name="cnyRoom" value="${o.cnyRoom||''}"></div>
<div class="field tujiaOnly hidden"><label>人民币优惠</label><input type="number" name="cnyDiscount" value="${o.cnyDiscount||''}"></div>
<div class="field tujiaOnly hidden"><label>人民币清扫费</label><input type="number" name="cnyCleaning" value="${o.cnyCleaning||''}"></div>
<div class="field tujiaOnly hidden"><label>人民币平台扣款（可留空）</label><input type="number" step="0.01" name="cnyFee" value="${o.cnyFee||''}"></div>
<div class="field tujiaOnly hidden"><label>日元实际到账（锚点）</label><input type="number" name="cnyReceipt" value="${o.cnyReceipt||''}"></div>
<div class="field span2"><label>优惠明细（可多项）</label><div id="discountRows"></div><button type="button" class="btn small" onclick="openDiscountPicker()">＋ 选择优惠项目</button></div>
<div class="field span2"><label>银行实际到账金额</label><input class="moneyInput" type="number" name="actualReceipt" value="${num(o.actualReceipt)||''}" placeholder="银行流水确认后再填写"><div class="hint">正常先留空。银行对账后如与理论应到账不同，再填写实际入账金额。</div></div>
<div class="field"><label>对账状态</label><select name="reconcileStatus"><option value="pending">待对账</option><option value="matched">已对账</option><option value="exception">异常</option></select></div>

const DISCOUNT_OPTIONS={
Airbnb:['新房源促销','自定义促销','连住优惠（周）','连住优惠（月）','其他连住优惠','早鸟优惠','直前优惠','不可退款优惠','手机端优惠','高评价房客优惠','其他优惠'],

途家:['出行特惠','学生特惠','节日期间限时大促','新房特惠','今夜特价','连住优惠','早鸟优惠','甩尾优惠','天天特惠','优惠券/新客优惠','其他优惠'],
其他:['平台促销优惠','优惠券','会员优惠','新客优惠','节日优惠','长期住宿优惠','回头客优惠','其他优惠']
};
function discountOptionsForPlatform(){let p=document.getElementById('orderForm')?.platform?.value||'其他';return DISCOUNT_OPTIONS[p]||DISCOUNT_OPTIONS.其他;}
function addDiscountRow(value=''){let box=document.getElementById('discountRows');if(!box)return;let raw=String(value),rawName=raw.split(':')[0].trim(),name=rawName,amount=num(raw.match(/[0-9]+(?:\.[0-9]+)?$/)?.[0])||'';let desc='';if(rawName.startsWith('其他优惠')){let m=rawName.match(/^其他优惠\s*\((.*?)\)$/);if(m){name='其他优惠';desc=m[1]}}let row=document.createElement('div');row.style.cssText='display:grid;grid-template-columns:1fr 120px 36px;gap:6px;margin-bottom:6px';row.innerHTML=`<select class="discountName" disabled><option value="${esc(name)}">${esc(name||'请选择优惠项目')}</option></select><input class="discountAmount moneyInput" type="number" min="0" placeholder="金额" value="${amount||''}"><button type="button" class="btn small" onclick="this.parentElement.remove();calcOrder()">×</button>${name==='其他优惠'?`<input class="discountDesc" type="text" placeholder="优惠说明（必填）" value="${esc(desc)}" style="grid-column:1 / 3">`:''}`;box.appendChild(row);row.querySelector('.discountAmount').addEventListener('input',()=>{syncDiscountTotal();calcOrder()});let d=row.querySelector('.discountDesc');if(d)d.addEventListener('input',calcOrder);}
function openDiscountPicker(){let old=document.getElementById('discountPicker');if(old)old.remove();let selected=new Set([...document.querySelectorAll('.discountName')].map(x=>x.value).filter(Boolean));let p=document.getElementById('orderForm')?.platform?.value||'其他';let options=discountOptionsForPlatform();let wrap=document.createElement('div');wrap.id='discountPicker';wrap.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center';let panel=document.createElement('div');panel.style.cssText='background:#fff;width:min(560px,100%);max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px';panel.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>选择优惠项目 · ${esc(p)}</b><button type="button" class="btn small" id="discountPickerCancel">取消</button></div><div id="discountChoices" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div><div style="margin-top:14px;text-align:right"><button type="button" class="btn primary" id="discountPickerDone">完成选择</button></div>`;wrap.appendChild(panel);document.body.appendChild(wrap);let choices=panel.querySelector('#discountChoices');options.forEach(x=>{let label=document.createElement('label');label.style.cssText='display:flex;align-items:center;gap:8px;padding:9px;border:1px solid #d9dee5;border-radius:8px';let cb=document.createElement('input');cb.type='checkbox';cb.value=x;cb.checked=selected.has(x);label.appendChild(cb);label.appendChild(document.createTextNode(x));choices.appendChild(label)});panel.querySelector('#discountPickerCancel').onclick=()=>wrap.remove();panel.querySelector('#discountPickerDone').onclick=()=>{let picked=[...choices.querySelectorAll('input:checked')].map(x=>x.value);let box=document.getElementById('discountRows');let current=[...box.querySelectorAll('.discountName')].map(x=>x.value);picked.filter(x=>!current.includes(x)).forEach(x=>addDiscountRow(x));[...box.querySelectorAll('.discountName')].forEach(row=>{if(row.value&&!picked.includes(row.value))row.closest('div').remove()});calcOrder();wrap.remove()};wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()});}
function syncDiscountTotal(){let f=document.getElementById('orderForm');if(!f)return;f.discount.value=[...document.querySelectorAll('.discountAmount')].reduce((s,x)=>s+num(x.value),0)}
function discountItems(){return [...document.querySelectorAll('.discountName')].map((n,i)=>{let a=document.querySelectorAll('.discountAmount')[i],row=n.closest('div'),d=row?.querySelector('.discountDesc');if(!n.value.trim()||!num(a?.value))return '';let label=n.value.trim();if(label==='其他优惠'&&d?.value.trim())label+=` (${d.value.trim()})`;return `${label}: ${num(a.value)}`}).filter(Boolean)}

function platformChanged(){let f=document.getElementById('orderForm');if(!f)return;let p=f.platform.value;document.querySelectorAll('.bookingOnly').forEach(e=>e.classList.toggle('hidden',p!=='Booking'));document.querySelectorAll('.tujiaOnly').forEach(e=>e.classList.toggle('hidden',p!=='途家'));document.querySelectorAll('.channelOnly').forEach(e=>e.classList.toggle('hidden',!(p==='直接预订'||p==='其他')));let allowed=new Set(discountOptionsForPlatform());document.querySelectorAll('#discountRows .discountName').forEach(n=>{if(n.value&&!allowed.has(n.value))n.closest('div').remove()});syncDiscountTotal();let sel=f.rate;let opts=[];if(p==='Airbnb')opts=(db.settings.platformRates?.Airbnb||[15.5,3]).map(v=>[v,`${v}%`]);else if(p==='Booking')opts=[[num(db.settings.platformRates?.Booking)||12,'12%']];else if(p==='途家')opts=[[num(db.settings.platformRates?.途家)||12,'12%']];else opts=[[0,'不适用']];let prevPlatform=f.dataset.lastPlatform;if(prevPlatform&&f.rate.value!==''&&prevPlatform!==p){let prevKey=prevPlatform==='Airbnb'?'Airbnb':prevPlatform==='Booking'?'Booking':prevPlatform==='途家'?'Tujia':'Other';f.dataset['rate'+prevKey]=f.rate.value;}sel.innerHTML=opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');let key=p==='Airbnb'?'Airbnb':p==='Booking'?'Booking':p==='途家'?'Tujia':'Other';let saved=num(f.dataset['rate'+key]||'');if(!saved&&p==='Airbnb')saved=num(f.dataset.savedRate||'');if(opts.some(x=>num(x[0])===saved))sel.value=String(saved);else sel.value=String(opts[0][0]);sel.disabled=(p==='直接预订'||p==='其他');f.dataset.savedRate=sel.value;f.dataset['rate'+key]=sel.value;f.dataset.lastPlatform=p;let ch=f.channelFeeType;if(ch){ch.value=f.dataset.savedChannelType||'none'}let cm=f.channelFeeMode;if(cm){cm.value=f.dataset.savedChannelMode||'percent'}f.elements.reconcileReason?.closest('.reconcileReason')?.classList.toggle('hidden',f.elements.reconcileStatus?.value!=='exception');calcOrder()}
function calcOrder(){let f=document.getElementById('orderForm');if(!f)return;syncDiscountTotal();let p=f.platform.value,base=num(f.room.value)-num(f.discount.value)+num(f.cleaning.value);let fee=platformFee({platform:p,room:f.room.value,discount:f.discount.value,cleaning:f.cleaning.value,otherIncome:f.otherIncome.value,rate:f.rate.value,bookingPayFee:f.bookingPayFee?.value!=='false',channelFeeMode:f.channelFeeMode?.value,channelFeeValue:f.channelFeeValue?.value});let theoretical=base+num(f.otherIncome.value)-fee;let actual=num(f.actualReceipt.value);let extra='';if(p==='途家'&&f.cnyMode.value==='true'){let cnyn=num(f.cnyRoom.value)-num(f.cnyDiscount.value)+num(f.cnyCleaning.value);let r=num(f.cnyReceipt.value);let rate=r&&cnyn?r/cnyn:0;let fj=num(f.cnyFee.value);if(!fj&&cnyn)fj=Math.round(cnyn*0.12*100)/100;extra=`<div class="calcRow"><span>人民币净额</span><b>¥${cnyn.toFixed(2)} CNY</b></div><div class="calcRow"><span>隐含汇率</span><b>${rate?rate.toFixed(4):'-'} JPY/CNY</b></div><div class="calcRow"><span>日元房费/优惠/清扫</span><b>${yen(Math.round(num(f.cnyRoom.value)*rate))} / ${yen(Math.round(num(f.cnyDiscount.value)*rate))} / ${yen(Math.round(num(f.cnyCleaning.value)*rate))}</b></div><div class="calcRow"><span>日元平台扣款</span><b>${yen(Math.round(fj*rate))}</b></div><div class="calcRow"><span>银行实际到账</span><b>${yen(r)}</b></div>`}else{let reason=f.reconcileReason?.value||'';let status=f.reconcileStatus?.value||'pending';extra=`<div class="calcRow"><span>销售额（含清扫）</span><b>${yen(base+num(f.otherIncome.value))}</b></div><div class="calcRow"><span>渠道费用</span><b>${yen(fee)}</b></div><div class="calcRow"><span>理论应到账</span><b>${yen(theoretical)}</b></div><div class="calcRow"><span>银行实际到账</span><b>${actual?yen(actual):'尚未录入（待银行对账）'}</b></div>${actual?`<div class="calcRow"><span>到账差额</span><b>${yen(actual-theoretical)}</b></div>`:''}<div class="calcRow"><span>对账状态</span><b>${status==='matched'?'已对账':status==='exception'?'异常'+(reason?' · '+reason:''):'待对账'}</b></div>`};document.getElementById('orderCalc').innerHTML=extra}

document.addEventListener('submit' ,async e=>{if(e.target.id!=='orderForm')return;e.preventDefault();let f=e.target,o=db.orders.find(x=>x.id===f.dataset.id)||null;try{let data={id:o?.id||id('o'),orderNo:f.orderNo.value.trim(),platform:f.platform.value,propertyId:f.propertyId.value,guest:f.guest.value.trim(),checkin:f.checkin.value,checkout:f.checkout.value,guests:num(f.guests.value),paidDate:f.paidDate.value,room:num(f.room.value),discount:num(f.discount.value),cleaning:num(f.cleaning.value),otherIncome:num(f.otherIncome.value),rate:num(f.rate.value),bookingPayFee:f.bookingPayFee?.value!=='false',cnyMode:f.cnyMode?.value==='true',cnyRoom:num(f.cnyRoom?.value),cnyDiscount:num(f.cnyDiscount?.value),cnyCleaning:num(f.cnyCleaning?.value),cnyFee:num(f.cnyFee?.value),cnyReceipt:num(f.cnyReceipt?.value),discounts:discountItems(),actualReceipt:num(f.actualReceipt?.value),reconcileStatus:f.reconcileStatus?.value||'pending',reconcileReason:f.reconcileReason?.value||'',channelFeeType:f.channelFeeType?.value||'none',channelFeeMode:f.channelFeeMode?.value||'percent',channelFeeValue:num(f.channelFeeValue?.value),note:f.note.value.trim()};if(data.platform==='途家'&&data.cnyMode&&data.cnyReceipt){let cnyn=data.cnyRoom-data.cnyDiscount+data.cnyCleaning;let rate=cnyn?data.cnyReceipt/cnyn:0;data.rateImplicit=rate;data.room=Math.round(data.cnyRoom*rate);data.discount=Math.round(data.cnyDiscount*rate);data.cleaning=Math.round(data.cnyCleaning*rate);let feeCny=data.cnyFee||cnyn*0.12;data.feeJpy=Math.round(feeCny*rate);data.rate=12;data.actualReceipt=data.cnyReceipt;}if(o)Object.assign(o,data);else db.orders.push(data);save();try{await handleFiles(document.getElementById('receiptFiles'),data.id,'receipt')}catch(fileErr){console.error(fileErr);toast('订单已保存，但附件保存失败');}syncCleaningExpense(data);closeModal();toast('订单已保存');render()}catch(err){console.error(err);toast('保存订单失败：'+(err?.message||err));}});
function syncCleaningExpense(o){let existing=db.expenses.find(e=>e.orderId===o.id&&e.type==='cleaning');if(num(o.cleaning)<=0){if(existing)db.expenses=db.expenses.filter(x=>x.id!==existing.id);save();return}let e={id:existing?.id||id('e'),orderId:o.id,date:o.paidDate||o.checkin,propertyId:o.propertyId,category:'清扫支出',amount:num(o.cleaning),payee:'',note:'订单清扫费自动镜像'};if(existing)Object.assign(existing,e);else db.expenses.push(e);save()}
function deleteOrder(oid){if(!confirm('删除订单？对应自动清扫支出也会删除。'))return;db.orders=db.orders.filter(o=>o.id!==oid);db.expenses=db.expenses.filter(e=>e.orderId!==oid);db.files=db.files.filter(f=>f.parentId!==oid);save();closeModal();toast('已删除');render()}
function handleFiles(input,parentId,type){return new Promise((resolve,reject)=>{try{if(!input||!input.files||!input.files.length){resolve();return}let files=[...input.files].slice(0,5);let pending=files.length;files.forEach(file=>{let r=new FileReader();r.onload=()=>{db.files.push({id:id('f'),parentId,type,name:file.name,mime:file.type,size:file.size,data:r.result});if(--pending===0){save();resolve()}};r.onerror=reject;r.readAsDataURL(file)})}catch(e){reject(e)}})}

function renderLodgers(){let arr=db.lodgers.slice().sort((a,b)=>String(b.checkin).localeCompare(String(a.checkin)));document.getElementById('lodgers').innerHTML=`<div class="sectionTitle"><div><h2 style="margin:0">宿泊者名簿</h2><div class="sub">每位入住者独立记录，可按订单关联</div></div><button class="btn primary" onclick="openLodger()">＋ 新增宿泊者</button></div><div class="toolbar"><input id="lodgerSearch" placeholder="搜索姓名 / 国籍 / 订单号" oninput="renderLodgers()"><button class="btn" onclick="exportCSV('lodgers')">导出 CSV</button></div>${lodgerTable(arr)}`}

function openLodger(lid){let x=db.lodgers.find(a=>a.id===lid)||{id:id('l'),count:1};document.getElementById('modalTitle').textContent=lid?'编辑宿泊者':'新增宿泊者';document.getElementById('modalBody').innerHTML=`<form id="lodgerForm" class="form"><div class="fields"><div class="field"><label>姓名 *</label><input name="name" required value="${esc(x.name)}"></div><div class="field"><label>国籍</label><input name="nationality" value="${esc(x.nationality)}"></div><div class="field"><label>订单号</label><input name="orderNo" value="${esc(x.orderNo)}"></div><div class="field"><label>入住人数</label><input type="number" min="1" name="count" value="${num(x.count)||1}"></div><div class="field"><label>入住日</label><input type="date" name="checkin" value="${x.checkin||''}"></div><div class="field"><label>退房日</label><input type="date" name="checkout" value="${x.checkout||''}"></div><div class="field"><label>地址</label><input name="address" value="${esc(x.address)}"></div><div class="field"><label>护照号码</label><input name="passport" value="${esc(x.passport)}"></div><div class="field span2"><label>备注</label><input name="note" value="${esc(x.note)}"></div><div class="field span2"><label>护照/名簿附件</label><input type="file" id="lodgerFile" accept="image/*,.pdf"></div></div><div class="actions" style="margin-top:13px"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button>${lid?`<button type="button" class="btn danger" onclick="deleteLodger('${x.id}')">删除</button>`:''}</div></form>`;document.getElementById('lodgerForm').dataset.id=x.id;document.getElementById('modal').classList.add('show')}

function renderExpenses(){let arr=db.expenses.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));document.getElementById('expenses').innerHTML=`<div class="sectionTitle"><div><h2 style="margin:0">支出</h2><div class="sub">普通支出＋订单自动镜像的清扫支出</div></div><button class="btn primary" onclick="openExpense()">＋ 新增支出</button></div><div class="toolbar"><input id="expenseSearch" placeholder="搜索支払先 / 科目 / 房源" oninput="renderExpenses()"><button class="btn" onclick="exportCSV('expenses')">导出 CSV</button></div>${expenseTable(arr)}`}
function expenseTable(arr){let q=document.getElementById('expenseSearch')?.value?.toLowerCase()||'';arr=arr.filter(x=>[x.payee,x.category,x.propertyId,x.note].join(' ').toLowerCase().includes(q));if(!arr.length)return `<div class="empty">暂无支出</div>`;return `<div class="tableWrap"><table class="table"><thead><tr><th>日期</th><th>科目</th><th>支払先</th><th>房源</th><th>税区分</th><th>金额</th><th>类型</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.payee)}</td><td>${esc(propName(x.propertyId))||'公司共用'}</td><td>${esc(x.taxType||'課税10%')}</td><td class="money">${yen(x.amount)}</td><td>${x.type==='cleaning'?'<span class="pill">订单清扫</span>':'普通支出'}</td><td>${x.type==='cleaning'?'':'<button class="btn small" onclick="openExpense(\''+x.id+'\')">查看</button>'}</td></tr>`).join('')}</tbody></table></div>`}
function openExpense(eid){let x=db.expenses.find(a=>a.id===eid)||{id:id('e'),date:new Date().toISOString().slice(0,10),taxType:'課税10%'};document.getElementById('modalTitle').textContent=eid?'编辑支出':'新增支出';document.getElementById('modalBody').innerHTML=`<form id="expenseForm" class="form"><div class="fields"><div class="field"><label>支出日 *</label><input type="date" name="date" required value="${x.date||''}"></div><div class="field"><label>支出科目 *</label><input list="cats" name="category" required value="${esc(x.category)}"><datalist id="cats"><option>水道光熱費</option><option>通信費</option><option>消耗品費</option><option>修繕費</option><option>租税公課</option><option>保険料</option><option>車両費</option><option>車両購入</option><option>広告宣伝費</option><option>旅費交通費</option><option>支払手数料</option><option>外注費</option><option>地代家賃</option><option>その他</option></datalist></div><div class="field"><label>金额 *</label><input type="number" name="amount" required value="${num(x.amount)}"></div><div class="field"><label>支払先</label><input name="payee" value="${esc(x.payee)}"></div><div class="field"><label>房源</label><select name="propertyId"><option value="">公司共用</option>${db.properties.map(p=>`<option value="${p.id}" ${x.propertyId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>税区分</label><select name="taxType"><option ${x.taxType==='課税10%'?'selected':''}>課税10%</option><option ${x.taxType==='非課税'?'selected':''}>非課税</option><option ${x.taxType==='不課税'?'selected':''}>不課税</option><option ${x.taxType==='課税8%'?'selected':''}>課税8%</option></select></div><div class="field span2"><label>备注</label><input name="note" value="${esc(x.note)}"></div><div class="field span4"><label>支出凭证</label><input type="file" id="expenseFile" multiple accept="image/*,.pdf"></div></div><div class="actions" style="margin-top:13px"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button>${eid?`<button type="button" class="btn danger" onclick="deleteExpense('${x.id}')">删除</button>`:''}</div></form>`;document.getElementById('expenseForm').dataset.id=x.id;document.getElementById('modal').classList.add('show')}
document.addEventListener('submit',async e=>{if(e.target.id!=='expenseForm')return;e.preventDefault();let f=e.target,x=db.expenses.find(a=>a.id===f.dataset.id)||{id:f.dataset.id,type:'normal'};Object.assign(x,{date:f.date.value,category:f.category.value.trim(),amount:num(f.amount.value),payee:f.payee.value.trim(),propertyId:f.propertyId.value,taxType:f.taxType.value,note:f.note.value.trim()});if(!db.expenses.includes(x))db.expenses.push(x);save();if(document.getElementById('expenseFile').files.length)await handleFiles(document.getElementById('expenseFile'),x.id,'expense');closeModal();toast('支出已保存');render()});
function deleteExpense(i){if(confirm('删除这笔支出？')){db.expenses=db.expenses.filter(x=>x.id!==i);db.files=db.files.filter(f=>f.parentId!==i);save();closeModal();render()}}
function renderProperties(){document.getElementById('properties').innerHTML=`<div class="sectionTitle"><div><h2 style="margin:0">房源</h2><div class="sub">房源是收入与支出的管理维度</div></div><button class="btn primary" onclick="openProperty()">＋ 新增房源</button></div><div class="grid g2">${db.properties.map(p=>`<div class="card"><div class="label">房源</div><div class="value" style="font-size:18px">${esc(p.name)}</div><div class="sub">清扫费 ${yen(p.cleaning)} · 间夜正常区间 ${yen(p.minNight)}–${yen(p.maxNight)}</div><div class="actions" style="margin-top:10px"><button class="btn small" onclick="openProperty('${p.id}')">编辑</button></div></div>`).join('')}</div>`}
function openProperty(pid){let p=db.properties.find(x=>x.id===pid)||{id:id('p'),cleaning:0,minNight:0,maxNight:0};document.getElementById('modalTitle').textContent=pid?'编辑房源':'新增房源';document.getElementById('modalBody').innerHTML=`<form id="propertyForm" class="form"><div class="fields"><div class="field span2"><label>房源全名 *</label><input name="name" required value="${esc(p.name)}"></div><div class="field"><label>清扫费</label><input type="number" name="cleaning" value="${num(p.cleaning)}"></div><div class="field"><label>间夜最低提示值</label><input type="number" name="minNight" value="${num(p.minNight)}"></div><div class="field"><label>间夜最高提示值</label><input type="number" name="maxNight" value="${num(p.maxNight)}"></div></div><div class="actions" style="margin-top:13px"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button>${pid?`<button type="button" class="btn danger" onclick="deleteProperty('${p.id}')">删除</button>`:''}</div></form>`;document.getElementById('propertyForm').dataset.id=p.id;document.getElementById('modal').classList.add('show')}
document.addEventListener('submit',e=>{if(e.target.id!=='propertyForm')return;e.preventDefault();let f=e.target,p=db.properties.find(x=>x.id===f.dataset.id)||{id:f.dataset.id};Object.assign(p,{name:f.name.value.trim(),cleaning:num(f.cleaning.value),minNight:num(f.minNight.value),maxNight:num(f.maxNight.value)});if(!db.properties.includes(p))db.properties.push(p);save();closeModal();toast('房源已保存');render()});
function deleteProperty(i){if(db.orders.some(o=>o.propertyId===i)||db.expenses.some(e=>e.propertyId===i)){alert('该房源已有订单或支出，不能删除。');return}if(confirm('删除房源？')){db.properties=db.properties.filter(x=>x.id!==i);save();closeModal();render()}}
function parseCSVLine(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function parseCSV(text){let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()!=='');if(!lines.length)return [];let head=parseCSVLine(lines[0]);return lines.slice(1).map(l=>{let a=parseCSVLine(l),o={};head.forEach((h,i)=>o[h]=a[i]??'');return o})}
function normalizeBankRow(raw){let keys=Object.keys(raw);let pick=(patterns)=>{let k=keys.find(k=>patterns.some(p=>String(k).toLowerCase().includes(p)));return k?raw[k]:''};let date=pick(['日付','取引日','date']);let desc=pick(['摘要','お取引内容','内容','description','memo','取引内容']);let credit=pick(['入金','預り','入金額','credit','deposit']);let debit=pick(['出金','支払','出金額','debit','withdraw']);let amount=credit?num(credit):0;if(!amount&&debit)amount=-Math.abs(num(debit));return {id:id('b'),date:String(date||''),description:String(desc||''),amount,raw,matchedType:'',matchedId:'',status:'pending'} }
function autoMatchBank(b){let abs=Math.abs(num(b.amount));if(!abs)return;let candidates=[];if(b.amount>0){db.orders.forEach(o=>{let a=receipt(o);if(a===abs)candidates.push({type:'order',id:o.id,label:`订单 ${o.orderNo||o.id}`} )})}else{db.expenses.forEach(e=>{if(num(e.amount)===abs)candidates.push({type:'expense',id:e.id,label:`支出 ${e.category} ${e.payee||''}`})})}if(candidates.length===1){b.matchedType=candidates[0].type;b.matchedId=candidates[0].id;b.status='matched'}else if(candidates.length>1){b.status='multiple'}else b.status='pending'}
function renderBank(){let matched=db.bank.filter(x=>x.status==='matched').length,pending=db.bank.filter(x=>x.status!=='matched').length;document.getElementById('bank').innerHTML=`<div class="sectionTitle"><div><h2 style="margin:0">银行</h2><div class="sub">导入银行 CSV → 自动匹配订单/支出；小公司先用最简单的方式</div></div><div class="actions"><button class="btn" onclick="document.getElementById('bankFile').click()">导入银行 CSV</button><input id="bankFile" type="file" accept=".csv,text/csv" class="hidden" onchange="importBankCSV(this)"></div></div><div class="grid g3"><div class="card"><div class="label">银行流水</div><div class="value">${db.bank.length}</div></div><div class="card"><div class="label">已匹配</div><div class="value">${matched}</div></div><div class="card"><div class="label">待处理</div><div class="value">${pending}</div></div></div><div class="section"><div class="note">目前支持常见 CSV：日期、摘要、入金、出金等列名可自动识别。第一次使用某家银行，如果列名特殊，我再按你的真实 CSV 调整。</div></div><div class="section"><div class="tableWrap"><table class="table"><thead><tr><th>日期</th><th>摘要</th><th>入出金</th><th>状态</th><th>匹配对象</th></tr></thead><tbody>${db.bank.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(b=>{let label=b.matchedType==='order'?`订单：${db.orders.find(o=>o.id===b.matchedId)?.orderNo||''}`:b.matchedType==='expense'?`支出：${db.expenses.find(e=>e.id===b.matchedId)?.category||''}`:'';return `<tr><td>${esc(b.date)}</td><td>${esc(b.description)}</td><td class="money">${yen(b.amount)}</td><td>${b.status==='matched'?'<span class="status ok">已匹配</span>':b.status==='multiple'?'<span class="status">多个候选</span>':'<span class="status">待处理</span>'}</td><td>${esc(label)||'<button class="btn small" onclick="manualBankMatch(\''+b.id+'\')">选择</button>'}</td></tr>`}).join('')||'<tr><td colspan="5">暂无银行流水</td></tr>'}</tbody></table></div></div>`}
function importBankCSV(input){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let rows=parseCSV(r.result).map(normalizeBankRow).filter(x=>x.date||x.description||x.amount);rows.forEach(autoMatchBank);db.bank.push(...rows);save();toast(`已导入 ${rows.length} 笔银行流水`);render()}catch(e){alert('CSV 读取失败，请把银行 CSV 发给我，我按你的银行格式调整。')}};r.readAsText(file,'UTF-8');input.value=''}
function manualBankMatch(id0){let b=db.bank.find(x=>x.id===id0);if(!b)return;let q=b.amount>0?db.orders.map(o=>({type:'order',id:o.id,label:`订单 ${o.orderNo||o.guest} · ${yen(receipt(o))}`})).filter(x=>Math.abs(num(db.orders.find(o=>o.id===x.id)&&receipt(db.orders.find(o=>o.id===x.id))))===Math.abs(num(b.amount))):db.expenses.map(e=>({type:'expense',id:e.id,label:`支出 ${e.category} ${e.payee||''} · ${yen(e.amount)}`})).filter(x=>num(db.expenses.find(e=>e.id===x.id)?.amount)===Math.abs(num(b.amount)));if(!q.length){alert('没有找到金额完全相同的候选。');return}let msg=q.map((x,i)=>`${i+1}. ${x.label}`).join('\n');let n=Number(prompt(`选择匹配对象：\n${msg}`));if(n>=1&&n<=q.length){b.matchedType=q[n-1].type;b.matchedId=q[n-1].id;b.status='matched';save();render()}}
function renderReports(){let os=statOrders(),es=db.expenses.filter(e=>inMode(e.date));let byPlatform={};os.forEach(o=>{let p=o.platform;byPlatform[p]??={count:0,sales:0,fee:0,receipt:0};byPlatform[p].count++;byPlatform[p].sales+=num(o.room)-num(o.discount)+num(o.cleaning)+num(o.otherIncome);byPlatform[p].fee+=platformFee(o);byPlatform[p].receipt+=receipt(o)});let rows=Object.entries(byPlatform).map(([p,v])=>`<tr><td>${platformBadge(p)}</td><td>${v.count}</td><td class="money">${yen(v.sales)}</td><td class="money">${yen(v.fee)}</td><td class="money">${yen(v.receipt)}</td><td>${v.sales?((v.fee/v.sales)*100).toFixed(2):'0.00'}%</td></tr>`).join('');let totalSales=os.reduce((s,o)=>s+num(o.room)-num(o.discount)+num(o.cleaning)+num(o.otherIncome),0),totalFee=os.reduce((s,o)=>s+platformFee(o),0),clean=os.reduce((s,o)=>s+num(o.cleaning),0),exp=es.filter(e=>e.type!=='cleaning').reduce((s,e)=>s+num(e.amount),0),net=os.reduce((s,o)=>s+receipt(o),0)-clean-exp;let tx=taxEx(totalSales);document.getElementById('reports').innerHTML=`<div class="sectionTitle"><div><h2 style="margin:0">统计与报表</h2><div class="sub">本期口径：${fiscalYear(new Date())} · 9月1日至次年8月31日</div></div><div class="actions"><button class="btn" onclick="exportCSV('report')">导出报表 CSV</button><button class="btn primary" onclick="printReport()">打印/另存 PDF</button></div></div><div class="grid g3"><div class="card"><div class="label">税込売上</div><div class="value">${yen(totalSales)}</div><div class="sub">税抜 ${yen(tx.net)} · 消費税 ${yen(tx.tax)}</div></div><div class="card"><div class="label">平台扣款</div><div class="value">${yen(totalFee)}</div><div class="sub">不从売上相抵</div></div><div class="card"><div class="label">純利益</div><div class="value">${yen(net)}</div><div class="sub">実収＋その他収入−支出−清掃支出</div></div></div><div class="section"><div class="sectionTitle"><h3>平台构成</h3></div><div class="tableWrap"><table class="table"><thead><tr><th>平台</th><th>单数</th><th>税込売上</th><th>平台扣款</th><th>实收</th><th>实际费率</th></tr></thead><tbody>${rows||'<tr><td colspan="6">暂无数据</td></tr>'}</tbody></table></div></div><div class="section"><div class="sectionTitle"><h3>税务口径月度/期间汇总</h3></div><div class="note">V0.2 已按你资料中的税务报表方向保留：税込売上、税抜、消費税、平台手数料分列；支出带勘定科目与税区分。这里暂不把本原型标记为正式申告软件。</div></div>`}
function printReport(){let old=view;window.print();setTimeout(()=>{},300)}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="sectionTitle"><div><h2 style="margin:0">设置</h2><div class="sub">费率、公司信息与数据备份</div></div></div><div class="form"><div class="fields"><div class="field span2"><label>公司名称</label><input id="company" value="${esc(db.settings.company)}"></div><div class="field"><label>会计期开始月份</label><select id="fiscalStart"><option value="9" ${db.settings.fiscalStart==9?'selected':''}>9月</option><option value="1">1月</option></select></div><div class="field"><label>默认消费税率</label><input id="tax" type="number" value="${db.settings.defaultTax}"></div><div class="field span2"><label>Airbnb 费率选项</label><div class="hint">当前：15.5%、3.0%（新订单联动）</div></div></div><div class="actions" style="margin-top:13px"><button class="btn primary" onclick="saveSettings()">保存设置</button><button class="btn" onclick="backup()">导出完整 JSON</button><button class="btn" onclick="document.getElementById('restore').click()">导入 JSON</button><input id="restore" type="file" accept="application/json" class="hidden" onchange="restore(this)"></div></div><div class="section"><div class="note">当前版本按两个人的小公司设计：订单、支出、银行 CSV、自动匹配、损益和税务汇总。重要资料请定期导出 JSON 备份。</div></div>`}
function saveSettings(){db.settings.company=document.getElementById('company').value.trim();db.settings.fiscalStart=num(document.getElementById('fiscalStart').value);db.settings.defaultTax=num(document.getElementById('tax').value)||10;save();toast('设置已保存');render()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'hokkyokusei-v02-backup.json')}
function restore(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.orders||!x.expenses)throw Error();db=x;save();toast('备份已导入');render()}catch(e){alert('JSON 备份格式不正确')}};r.readAsText(f)}
function exportCSV(type){let rows=[];if(type==='orders'){rows=[['订单号','平台','房源','客人','入住日','退房日','晚数','房费','优惠','清扫费','其他收入','渠道费用','理论应到账','实际到账','对账状态','差额原因','到账日','备注'],...db.orders.map(o=>[o.orderNo,o.platform,propName(o.propertyId),o.guest,o.checkin,o.checkout,nights(o),o.room,o.discount,o.cleaning,o.otherIncome,platformFee(o),theoreticalReceipt(o),num(o.actualReceipt)||'',o.reconcileStatus||'待对账',o.reconcileReason||'',o.paidDate,o.note])]}else if(type==='expenses'){rows=[['支出日','科目','支払先','房源','税区分','金额','类型','备注'],...db.expenses.map(e=>[e.date,e.category,e.payee,propName(e.propertyId)||'公司共用',e.taxType,e.amount,e.type,e.note])]}else if(type==='lodgers'){rows=[['入住日','退房日','姓名','国籍','订单号','人数','地址','护照号码','备注'],...db.lodgers.map(x=>[x.checkin,x.checkout,x.name,x.nationality,x.orderNo,x.count,x.address,x.passport,x.note])]}else{let os=statOrders(),es=db.expenses.filter(e=>inMode(e.date));rows=[['区分','金额'],['税込売上',os.reduce((s,o)=>s+num(o.room)-num(o.discount)+num(o.cleaning)+num(o.otherIncome),0)],['平台扣款',os.reduce((s,o)=>s+platformFee(o),0)],['实收',os.reduce((s,o)=>s+receipt(o),0)],['清扫支出',os.reduce((s,o)=>s+num(o.cleaning),0)],['普通支出',es.filter(e=>e.type!=='cleaning').reduce((s,e)=>s+num(e.amount),0)]]}let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),`hokkyokusei-${type}-${Date.now()}.csv`)}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
nav();render();
</script></body></html>
